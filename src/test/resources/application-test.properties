spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Не обращаться к реальному Keycloak во время тестов.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://test.invalid/realms/t-health
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://test.invalid/jwks

keycloak.admin.base-url=http://test.invalid
keycloak.admin.realm=t-health
keycloak.admin.client-id=test-client
keycloak.admin.client-secret=test-secret

# Заглушка для обязательного placeholder из application.properties;
# реальные параметры подключения подставляет @ServiceConnection.
spring.datasource.password=test
