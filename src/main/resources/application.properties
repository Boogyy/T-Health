spring.application.name=TBankHealth

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:t_health_db}
spring.datasource.username=${POSTGRES_USER:t_health_user}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/t-health

keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:t-health}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:t-health-admin}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}